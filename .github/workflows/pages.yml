# Publica o site no GitHub Pages a cada push na main,
# e uma vez por dia para trazer os posts novos do Instagram.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *' # 6h em São Paulo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O evento agendado não traz o nome do repositório, então ele sai de GITHUB_REPOSITORY.
      - run: BASE="/${GITHUB_REPOSITORY#*/}" npm run build
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          INSTAGRAM_FEED_URL: ${{ vars.INSTAGRAM_FEED_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
